name: Worker integration smoke
on:
  pull_request:
    paths:
      - 'environmentScenarios.ts'
      - 'tests/environment-scenarios.test.ts'
      - 'e2e/environment-scenarios.spec.ts'
      - 'sideWindows.ts'
      - 'SideWindowDemo.tsx'
      - 'sideWindowDemo.css'
      - 'windowDemo.ts'
      - 'selfTubes.ts'
      - 'tests/self-tubes.test.ts'
      - 'tests/support/self-tubes.ts'
      - 'tests/window-demo.test.ts'
      - 'tests/side-windows.test.ts'
      - 'e2e/side-windows.spec.ts'
      - 'simulation.worker.ts'
      - 'energyEconomy.ts'
      - 'energyActivity.ts'
      - 'eggReserve.ts'
      - 'tests/egg-reserve.test.ts'
      - 'tests/support/egg-reserve.ts'
      - 'e2e/egg-reserve.spec.ts'
      - 'tests/energy-activity.test.ts'
      - 'tests/support/energy-activity.ts'
      - 'e2e/energy-activity.spec.ts'
      - 'tests/closed-energy.test.ts'
      - 'mouthGeometry.ts'
      - 'mouthContactAudit.ts'
      - 'tests/mouth-contact.test.ts'
      - 'CreaturePreview.tsx'
      - 'tests/solver-passivity.test.ts'
      - 'solverPassivityAudit.ts'
      - 'foundationPhysics.ts'
      - 'tests/foundation-physics.test.ts'
      - 'scripts/check-worker.mjs'
      - 'App.tsx'
      - 'styles.css'
      - 'e2e/presentation.spec.ts'
      - 'BrainGraph.tsx'
      - 'persistence.ts'
      - 'constants.ts'
      - 'playground_config.json'
      - 'workerPacing.ts'
      - 'playwright.worker-firefox.config.ts'
      - 'tests/worker-pacing.test.ts'
      - 'simulationHost.ts'
      - 'simulationClient.ts'
      - 'e2e/performance-worker.spec.ts'
      - '.github/workflows/performance-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    # The expanded serial Chromium/Firefox suite exceeds the former 12-minute job budget.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run build
      - run: npm run test:worker
      - name: Verify physical self-tubes, caller consent, full-state transfer and camera rendering
        run: npx playwright test e2e/side-windows.spec.ts --workers=1
      - name: Preserve side-window visual acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: side-window-previews
          path: test-results/**/side-windows-*.png
      - name: Verify stable toolbar geometry and interactions
        run: npx playwright test e2e/presentation.spec.ts --grep 'toolbar stays' --workers=1
      - run: npx playwright test e2e/performance-worker.spec.ts e2e/energy-activity.spec.ts e2e/egg-reserve.spec.ts e2e/environment-scenarios.spec.ts --workers=1
      - run: npx playwright test --config=playwright.worker-firefox.config.ts --workers=1

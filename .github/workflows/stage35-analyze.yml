name: Stage 3.5 evidence verification only
on:
  push:
    branches: [audit/performance-stage-3-5]
    paths: ['.github/workflows/stage35-analyze.yml']
permissions:
  contents: write
jobs:
  verify-retained-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify original archives and derive numerical findings without execution
        run: node scripts/performance-stage35/analyze.mjs
      - name: Preserve derived verification and environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/performance-stage35/preserve.mjs

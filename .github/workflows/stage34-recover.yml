name: Recover existing Stage 3.4 evidence
on:
  push:
    branches: [audit/performance-stage-3-4-evidence]
    paths:
      - 'scripts/performance-stage34/recover.mjs'
      - '.github/workflows/stage34-recover.yml'
permissions:
  contents: write
  actions: read
jobs:
  recover-existing-log:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/performance-stage-3-4-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recover and verify existing archives without scientific execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/performance-stage34/recover.mjs

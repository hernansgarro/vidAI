name: Stage 3.10 registered 150-organism attribution
on:
  push:
    branches: [audit/performance-stage-3-10]
    paths:
      - 'scripts/performance-stage310/measurement.mjs'
      - '.github/workflows/stage310-measure.yml'
permissions:
  contents: write
jobs:
  bounded-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install and validate exact research source
        run: timeout 480s bash -e -c 'npm ci && node scripts/performance-stage39/test-archive.mjs && npm run test:fast && npm run build && npm run test:worker'
      - name: Execute registered lot once
        run: timeout --signal=TERM --kill-after=15s 720s npx playwright test --config=scripts/performance-stage310/measurement.config.mjs --workers=1
      - name: Upload original evidence even after failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stage310-original-evidence
          path: docs/experiments/performance-stage-3-v12-execution
          if-no-files-found: warn
      - name: Commit originals to isolated research branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout 180s node scripts/performance-stage310/preserve.mjs
